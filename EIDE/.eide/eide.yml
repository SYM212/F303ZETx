version: "4.1"
name: F303ZETx
type: ARM
deviceName: null
packDir: null
srcDirs:
  - ../Hardware
  - ../Library
  - ../Periph
  - ../Start
  - ../System
  - ../User
virtualFolder:
  name: <virtual_root>
  files:
    - path: ../Start/arm_cortexM4lf_math.lib
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: a113da662c81924e37db8e5579903839
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - STM32F303xE
        - USE_STDPERIPH_DRIVER
        - ARM_MATH_CM4
      incList:
        - ../Hardware
        - ../Library
        - ../Periph
        - ../Start
        - ../System
        - ../User
      libList:
        - ../Library
    excludeList:
      - ../Start/ARM/startup_stm32f302x8.s
      - ../Start/ARM/startup_stm32f303xc.s
      - ../Start/ARM/startup_stm32f30x.s
      - ../Start/ARM/startup_stm32f334x8.s
      - ../Start/arm_cortexM4lf_math.lib
    settings:
      debugger: cortex-debug
    toolchain: AC5
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 4
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: unspecified
          global:
            output-debug-info: disable
          linker:
            output-format: elf
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x10000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: true
              mem:
                size: "0x4000"
                startAddr: "0x10000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x80000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: stlink
        target: stm32f3x
    uploader: OpenOCD
